<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17271f"><title>__TITLE__ · 旅迹天气</title><style>__MAP_CSS__</style><style>__APP_CSS__</style></head>
<body><main id="app">
<div id="map" aria-label="真实地形与行程路线"></div><div class="map-shade" aria-hidden="true"></div><div class="map-status" id="map-status">正在展开地形</div>
<header class="header"><a class="brand" href="#" aria-label="旅迹天气全程地图"><i data-lucide="route"></i><span>旅迹天气</span></a><span class="header-divider"></span><nav class="discovery" aria-label="探索线路"><button id="region-button" class="nav-button">地区<i data-lucide="chevron-down"></i></button><button id="theme-button" class="nav-button">主题<i data-lucide="chevron-down"></i></button></nav><div class="header-center" id="header-region"></div><button id="save-button" class="save-button" aria-label="保存行程"><i data-lucide="bookmark"></i><span>保存行程</span></button></header>
<section class="trip-heading contextual" aria-label="当前行程"><div class="eyebrow" id="trip-eyebrow"></div><div class="trip-title"><h1 id="trip-title"></h1></div><div class="trip-route" id="trip-dates"></div><div class="trip-details"><span><i data-lucide="footprints"></i><b id="trip-duration"></b></span><span id="trip-direction"></span></div><div class="trip-actions"><button id="edit-button"><i data-lucide="sliders-horizontal"></i>编辑行程</button><button id="overview-button"><i data-lucide="notebook-tabs"></i>全程概览</button></div><button id="access-button" class="access-note"><span class="tiny-dot"></span><span>开放与接驳待核实</span><i data-lucide="arrow-up-right"></i></button><div id="constraint-warning" class="constraint-warning" hidden></div></section>
<section class="day-caption contextual" aria-label="当天路线"><div class="day-number" id="day-number">01</div><div><span id="day-date"></span><h2 id="day-route"></h2><p id="day-lodging"></p></div></section>
<aside id="weather-panel" class="weather-panel contextual" aria-label="地点天气与多模型对比">
<div class="panel-kicker"><span class="tiny-dot"></span><span id="forecast-status"></span><button id="refresh-button" aria-label="刷新全部地点天气"><i data-lucide="refresh-cw"></i></button></div>
<div class="place-title"><div><h2 id="place-name"></h2><span id="place-coordinates"></span></div><button id="locate-button" class="icon-button" aria-label="定位当前地点"><i data-lucide="scan"></i></button></div>
<p class="place-note" id="place-note" hidden></p>
<div class="current-weather"><div class="temperature"><span id="current-temperature">—</span><span class="degree">°</span></div><div class="weather-description"><i id="weather-icon" data-lucide="cloud"></i><button id="weather-description" class="weather-condition-button" aria-label="查看天气类型与降水解读"></button><span id="selected-time-label"></span></div></div>
<div class="weather-stats"><div><span>体感</span><strong id="apparent">—</strong></div><div><span>阵风上界</span><strong id="gust">—</strong></div><div><button id="precipitation-help" class="stat-help" aria-label="小时降水是什么意思"><span>小时降水</span><i data-lucide="info"></i></button><strong id="precipitation">—</strong><small id="precipitation-window"></small></div></div><div class="forecast-horizon" id="forecast-horizon"></div><div class="panel-rule"></div>
<div class="forecast-heading"><h3>多模型对照</h3><button id="source-button" aria-label="查看模型与数据来源"><i data-lucide="info"></i></button></div>
<div class="metric-tabs" role="tablist" aria-label="天气指标"><button role="tab" aria-selected="true" data-metric="temperature_2m">气温<span>°C</span></button><button role="tab" aria-selected="false" data-metric="precipitation">降水<span>mm</span></button><button role="tab" aria-selected="false" data-metric="wind_speed_10m">风速<span>m/s</span></button></div>
<div class="chart-wrap"><canvas id="weather-chart" aria-label="所选地点当天的逐小时模型预报"></canvas><div id="chart-empty" hidden>所选日期尚无可用预报</div></div><div class="model-list" id="model-list" aria-label="预报模型显示开关"></div><p class="model-note" id="model-note"></p><div class="weather-links"><button id="expand-weather" class="quiet-link">逐小时数值<i data-lucide="arrow-up-right"></i></button>
<button id="night-weather" class="quiet-link night-link">营地夜间<i data-lucide="moon"></i></button>
</div><button id="mobile-weather-toggle" class="mobile-weather-toggle" aria-expanded="false">展开模型对照<i data-lucide="chevron-up"></i></button></aside>
<div class="map-controls" aria-label="地图操作"><button id="compass-button" class="compass" aria-label="恢复北向"><span>N</span><i data-lucide="navigation"></i></button><div class="zoom-controls"><button id="zoom-in" aria-label="放大地图"><i data-lucide="plus"></i></button><button id="zoom-out" aria-label="缩小地图"><i data-lucide="minus"></i></button></div><button id="fit-button" aria-label="显示当天路线"><i data-lucide="scan-line"></i></button><button id="all-route-button" aria-label="显示全程路线"><i data-lucide="route"></i></button><button id="terrain-button" aria-label="切换二维与三维地形" aria-pressed="true">3D</button><button id="layers-button" aria-label="切换卫星与地形底图"><i data-lucide="layers-2"></i></button></div>
<div class="map-legend contextual"><span><i class="solid-line"></i>地图步道</span><span><i class="dashed-line"></i>行程连线示意</span></div>
<section class="journey-dock contextual" aria-label="逐日行程和沿途天气"><div class="journey-days" id="journey-days"></div><div class="day-stops" id="day-stops" aria-label="当天途经地点"></div><div class="time-strip"><button id="play-button" class="play-button" aria-label="播放逐小时天气"><i data-lucide="play"></i></button><div class="slider-section"><div class="slider-head"><span>预报时刻</span><strong id="time-value">14:00</strong><span class="time-zone">北京时间</span></div><input id="time-slider" type="range" min="0" max="23" step="1" value="14" aria-label="预报时刻"><div class="time-ticks"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:00</span></div></div></div></section>
<button id="focus-button" class="focus-button" aria-label="专注地图"><i data-lucide="expand"></i><span>专注地图</span></button><button id="data-credit" class="data-credit">路径与预报来源<i data-lucide="arrow-up-right"></i></button>
<dialog id="detail-dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" aria-label="关闭详情"><i data-lucide="x"></i></button></div><div id="dialog-content"></div></dialog>
<dialog id="editor" class="editor-dialog"><div class="dialog-heading"><div><div class="eyebrow">日程 · 地点 · 停留时间</div><h2>编辑行程</h2></div><button class="icon-button" id="close-editor" aria-label="关闭行程编辑器"><i data-lucide="x"></i></button></div><div class="editor-top"><label>出发日期<input type="date" id="edit-start"></label><label>结束日期<input type="date" id="edit-end"></label><button id="apply-dates" class="outline-button">应用日期</button><button id="choose-variant" class="outline-button">更换线路变体</button></div><p class="editor-help" id="edit-date-note"></p><div id="edit-days"></div><button class="outline-button" id="add-day"><i data-lucide="plus"></i>增加一天</button><section class="requirements-section"><label for="requirements">额外的行程要求</label><textarea id="requirements" rows="3" placeholder="例如：不露营，每天徒步不超过 5 小时；冷嘎措多留一小时拍照。"></textarea><div class="editor-help">“不露营”和每日徒步时长上限会参与冲突检查；其他要求由你或 Skill 调整地点与时刻后落实。</div><div class="constraint-fields"><label><input type="checkbox" id="allow-camping">允许露营</label><label>每日徒步上限 <input id="max-hike-hours" type="number" min="0" max="24" step="0.5" placeholder="不限"> 小时</label></div></section><div id="edit-errors" role="alert"></div><div class="editor-footer"><button class="outline-button" id="import-plan"><i data-lucide="upload"></i>导入 JSON</button><input id="import-file" type="file" accept=".json,application/json" hidden><button class="outline-button" id="export-plan"><i data-lucide="download"></i>导出行程</button><button class="solid-button" id="apply-plan">应用行程<i data-lucide="arrow-right"></i></button></div></dialog>
<dialog id="catalog-dialog"><div class="dialog-heading"><h2>选择线路</h2><button id="close-catalog" class="icon-button" aria-label="关闭线路选择"><i data-lucide="x"></i></button></div><p class="catalog-intro">地区和主题是并列筛选条件。</p><div class="catalog-filters"><label>地区<select id="province-filter"></select></label><label>主题<select id="theme-filter"></select></label></div><div id="catalog-routes"></div><p class="editor-help">当前为已核实的种子目录。未收录的目的地可让旅迹天气 Skill 检索新增，或导入自定义行程。</p></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</main><script id="journey-data" type="application/json">__DATA__</script><script>__MAP_JS__</script><script>__ICONS_JS__</script><script>__APP_JS__</script></body></html>
